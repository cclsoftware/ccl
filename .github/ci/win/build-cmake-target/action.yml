name: Prepare Windows Build Environment
  
inputs:
  image:
    description: 'Docker Image'
    required: true
    default: 'ccl-win-base:latest'
  dockerargs:
    description: 'Additional Docker Arguments'
    required: false
    default: ''
  signclientid:
    description: 'Signing Client ID'
    required: true
    default: ''
  signtenantid:
    description: 'Signing Tenant ID'
    required: true
    default: ''
  signendpoint:
    description: 'Signing Endpoint URL'
    required: true
    default: ''
  signaccount:
    description: 'Signing Account Name'
    required: true
    default: ''
  signprofile:
    description: 'Signing Certificate Profile'
    required: true
    default: ''
  signserver:
    description: 'Signing Timestamp Server'
    required: true
    default: ''
  signsecret:
    description: 'Signing Secret'
    required: true
    default: ''
  
runs:
  using: "composite"
  steps:
    
    - name: Build CMake Target
      shell: bash
      run: |
        docker run \
          --volume "${{ github.workspace }}:C:\w" \
          --workdir "C:\\w" \
          -e ccl_SIGNING_AZURE_CLIENTID_WIN="${{ inputs.signclientid }}" \
          -e ccl_SIGNING_AZURE_TENANTID_WIN="${{ inputs.signtenantid }}" \
          -e ccl_SIGNING_ENDPOINT_WIN="${{ inputs.signendpoint }}" \
          -e ccl_SIGNING_ACCOUNTNAME_WIN="${{ inputs.signaccount }}" \
          -e ccl_SIGNING_PROFILE_WIN="${{ inputs.signprofile }}" \
          -e ccl_SIGNING_TIMESTAMP_SERVER_WIN="${{ inputs.signserver }}" \
          -e ccl_SIGNING_AZURE_SECRET="${{ inputs.signsecret }}" \
          ${{ inputs.dockerargs }} \
          ghcr.io/cclsoftware/${{ inputs.image }} \
          bash ./.github/ci/win/build_cmake_target.sh
          